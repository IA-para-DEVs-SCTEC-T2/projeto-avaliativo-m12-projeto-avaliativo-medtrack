name: MedTrack CI

on:
  push:
    branches: [ main, develop, feature/**, docs/** ]
  pull_request:
    branches: [ develop ]

jobs:
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check-frontend
        run: |
          if [ -f "./frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏭️ Frontend ainda não inicializado — pulando checks"
          fi

      - name: Setup Node.js
        if: steps.check-frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Lint — ESLint
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run build

  security-check:
    name: Security — No secrets in code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for .env files committed
        run: |
          if git ls-files | grep -E '^\.env$'; then
            echo "❌ Arquivo .env encontrado no repositório!"
            exit 1
          fi
          echo "✅ Nenhum arquivo .env no repositório"
