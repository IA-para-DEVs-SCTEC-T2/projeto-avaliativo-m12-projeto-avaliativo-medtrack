name: MedTrack CI

on:
  push:
    branches: [ main, develop, feature/**, docs/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: medtrack_test
          POSTGRES_USER: medtrack_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Lint — Checkstyle
        working-directory: ./backend
        run: mvn checkstyle:check --no-transfer-progress

      - name: Run Tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: medtrack_test
          DB_USER: medtrack_user
          DB_PASSWORD: test_password
          JWT_SECRET: test-secret-key-for-ci-only-not-real-64chars-padding-here
          JWT_EXPIRATION_MS: 86400000
          MAIL_HOST: localhost
          MAIL_PORT: 1025
          MAIL_USERNAME: test
          MAIL_PASSWORD: test
          FDA_API_BASE_URL: https://api.fda.gov
          ADMIN_DEFAULT_PASSWORD: AdminTest@123
        run: mvn test --no-transfer-progress

      - name: Build
        working-directory: ./backend
        run: mvn package -DskipTests --no-transfer-progress

  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint — ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run build

  security-check:
    name: Security — No secrets in code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for .env files committed
        run: |
          if git ls-files | grep -E '^\.env$'; then
            echo "❌ Arquivo .env encontrado no repositório!"
            exit 1
          fi
          echo "✅ Nenhum arquivo .env no repositório"
