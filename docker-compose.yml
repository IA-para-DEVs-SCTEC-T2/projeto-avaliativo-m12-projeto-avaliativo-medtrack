services:
  db:
    image: postgres:15-alpine
    container_name: medtrack-db
    environment:
      POSTGRES_DB: ${DB_NAME:-medtrack}
      POSTGRES_USER: ${DB_USER:-medtrack_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medtrack_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: medtrack-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medtrack}
      DB_USER: ${DB_USER:-medtrack_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FDA_API_BASE_URL: ${FDA_API_BASE_URL:-https://api.fda.gov}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: medtrack-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:80"

volumes:
  postgres_data:
